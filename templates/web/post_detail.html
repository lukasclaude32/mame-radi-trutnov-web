{% extends "base.html" %}

{% block title %}{{ post.title }} – Máme rádi Trutnov{% endblock %}

{% block content %}
<article class="py-16 lg:py-24">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        <a href="{% url 'posts' %}" class="inline-flex items-center gap-2 text-primary-600 hover:text-primary-700 mb-8 font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            Zpět na aktuality
        </a>

        <p class="text-primary-600 font-medium mb-2">{{ post.created_at|date:"j. F Y" }}</p>
        <h1 class="text-3xl lg:text-4xl font-bold text-gray-900 mb-6">{{ post.title }}</h1>

        {% if post.image %}
        <img src="{{ post.image.url }}" alt="{{ post.title }}" class="w-full rounded-2xl mb-8 shadow-sm">
        {% endif %}

        <div class="prose prose-lg max-w-none text-gray-600 leading-relaxed space-y-4">
            {{ post.content|linebreaksbr }}
        </div>
    </div>
</article>
{% endblock %}
